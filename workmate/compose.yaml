services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      WORKMATE_DB_PATH: /state/practice.db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - workmate-state:/state
    depends_on:
      - redis
  redis:
    image: redis:7-alpine
volumes:
  workmate-state:
